<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#1a1a2e"/>
  <!-- Tire tread pattern -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#e94560" stroke-width="3"/>
  <circle cx="16" cy="16" r="7" fill="none" stroke="#e94560" stroke-width="1.5"/>
  <!-- Tread marks -->
  <line x1="16" y1="4" x2="16" y2="9" stroke="#e94560" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="23" x2="16" y2="28" stroke="#e94560" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4" y1="16" x2="9" y2="16" stroke="#e94560" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="16" x2="28" y2="16" stroke="#e94560" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Diagonal treads -->
  <line x1="7.5" y1="7.5" x2="10.5" y2="10.5" stroke="#e94560" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21.5" y1="21.5" x2="24.5" y2="24.5" stroke="#e94560" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24.5" y1="7.5" x2="21.5" y2="10.5" stroke="#e94560" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10.5" y1="21.5" x2="7.5" y2="24.5" stroke="#e94560" stroke-width="1.5" stroke-linecap="round"/>
</svg>
